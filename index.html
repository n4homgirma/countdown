<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>የሁሉ ቤተሰብ የአመራር እና ማናጅመንት ወርክሾፕ 4 · Yehulu SACCOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@500;600;700;900&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Yehulu SACCOS brand palette */
  :root {
    --growth: #24b663;
    --ever:   #034d3d;
    --white:  #ffffff;

    --bg: var(--ever);
    --fg: var(--white);
    --accent: var(--growth);
    --pat: var(--growth);
    --panel: clamp(64px, 9vw, 170px);
    --ring: min(33vw, 64vh);

    --latin: "Rubik", Arial, sans-serif;
    --ethiopic: "Noto Sans Ethiopic", Ebrima, sans-serif;
  }
  /* timer finished: white background, everything in Growth Green */
  body.done { --fg: var(--growth); --accent: var(--growth); --pat: var(--growth); }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--latin);
    display: grid; grid-template-columns: var(--panel) minmax(0, 1fr) var(--panel); grid-template-rows: minmax(0, 1fr) auto;
    height: 100vh; height: 100dvh; overflow: hidden; position: relative;
    -webkit-font-smoothing: antialiased;
  }
  /* Growth Green wash used for the "starting now" state */
  body::before {
    content: ""; position: fixed; inset: 0; background: var(--white);
    opacity: 0; transition: opacity .8s ease; pointer-events: none;
  }
  body.done::before { opacity: 1; }

  /* ---------- leaving the end screen: the white collapses into the timer ring ---------- */
  body.leaving::before { animation: wash-out 1.15s cubic-bezier(.7,0,.25,1) forwards; }
  @keyframes wash-out {
    0%   { opacity: 1; clip-path: circle(150vmax at var(--cx, 70%) var(--cy, 50%)); }
    99%  { opacity: 1; clip-path: circle(0px    at var(--cx, 70%) var(--cy, 50%)); }
    100% { opacity: 0; clip-path: circle(0px    at var(--cx, 70%) var(--cy, 50%)); }
  }
  body.leaving h1      { animation: settle .9s .5s cubic-bezier(.2,.7,.2,1) both; }
  body.leaving .digits { animation: settle .8s .35s cubic-bezier(.2,.7,.2,1) both; }
  body.leaving .caption, body.leaving .eyebrow, body.leaving .logo { animation: settle .8s .6s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes settle { from { opacity: 0; transform: translateY(.35rem); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
  /* the progress ring sweeps back to full instead of jumping */
  body.leaving .ring .prog { transition: stroke-dasharray 1.2s .2s cubic-bezier(.3,.7,.2,1), opacity .4s .2s, stroke .8s; }
  /* Brand gradient (Growth Green -> Ever Green), digital use */
  .glow {
    position: fixed; inset: 0; pointer-events: none; opacity: 1; transition: opacity .8s;
    background:
      radial-gradient(60vmax 60vmax at 100% 100%, rgba(36,182,99,.28), transparent 60%),
      radial-gradient(40vmax 40vmax at 0% 0%, rgba(36,182,99,.10), transparent 60%);
  }
  body.done .glow { opacity: 0; }

  /* ---------- content ---------- */
  .stage { position: relative; z-index: 2; min-width: 0; display: flex; align-items: stretch; }
  .main {
    position: relative; min-width: 0; flex: 1 1 auto;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: clamp(1.25rem, 5vh, 3.25rem) clamp(1.25rem, 4.5vw, 4.5rem);
    gap: 1.5rem; text-align: left;               /* brand: stay left-aligned */
  }
  .logo { position: relative; align-self: flex-start; height: clamp(80px, 12vh, 124px); aspect-ratio: 3513 / 1334; }
  .logo img { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity .8s; }
  .logo .on-green { opacity: 0; }
  /* solid green logo for the white end screen: logo artwork used as a mask over Growth Green */
  .logo .on-white {
    position: absolute; inset: 0; background: var(--growth); opacity: 0; transition: opacity .8s;
    -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat;
  }
  body.done .logo .on-dark { opacity: 0; }
  body.done .logo .on-white { opacity: 1; }

  .hero { display: flex; flex-direction: column; gap: clamp(.75rem, 2vh, 1.5rem); margin-block: auto; }   /* centred in the space under the logo */
  .eyebrow {
    font-family: var(--ethiopic); font-weight: 600; color: var(--accent);
    font-size: clamp(.95rem, 1.45vw, 1.45rem); line-height: 1.45; max-width: 34em;
    transition: color .8s;
  }
  h1 {
    font-family: var(--ethiopic); font-weight: 900; margin: 0; color: var(--fg);
    font-size: clamp(3rem, 6.6vw, 8.6rem); line-height: 1.1;
    transition: color .8s, font-size .8s cubic-bezier(.3,.7,.2,1);
  }
  body.running h1 { font-size: clamp(2.3rem, 4.8vw, 6.2rem); }   /* steps back while the timer takes focus */
  .nb { white-space: nowrap; }
  /* end screen: main title in an Ever Green -> Growth Green gradient (top to bottom, so it works however the lines wrap) */
  body.done h1 {
    background: linear-gradient(170deg, var(--ever) 15%, var(--growth) 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* ---------- ring counter ---------- */
  .counter {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    gap: 1rem;
    padding: clamp(1.25rem, 5vh, 3.25rem) clamp(.5rem, 2vw, 2.5rem);
  }
  .ring {
    /* smaller while idle/paused, full size while running (and on the end screen) */
    position: relative; width: calc(var(--ring) * .78); aspect-ratio: 1; container-type: inline-size;
    transition: width .8s cubic-bezier(.3,.7,.2,1);
    display: grid; place-items: center;
  }
  body.running .ring, body.done .ring { width: var(--ring); }
  .clock { margin-block: auto; display: flex; flex-direction: column; align-items: center; gap: calc(var(--ring) * .05); }
  .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .ring .track { fill: rgba(255,255,255,.035); stroke: rgba(255,255,255,.12); stroke-width: 4.6; transition: all .8s; }
  .ring .prog  {
    fill: none; stroke: var(--accent); stroke-width: 4.6; stroke-linecap: round; transition: stroke .8s, opacity .3s, filter 1s ease;
    filter: drop-shadow(0 0 1px rgba(36,182,99,0)) drop-shadow(0 0 4px rgba(36,182,99,0));
  }
  body.running .ring .prog { filter: drop-shadow(0 0 1px rgba(36,182,99,.6)) drop-shadow(0 0 4px rgba(36,182,99,.3)); }
  body.done .ring .track { fill: rgba(36,182,99,.06); stroke: rgba(36,182,99,.25); }
  .ring .inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1.5cqi; }
  /* optional caption above the digits (speaker name, session, etc.) */
  .caption {
    font-family: var(--ethiopic), var(--latin); font-weight: 900; text-align: center;
    font-size: calc(var(--ring) * .12); line-height: 1.2; width: var(--ring); color: var(--fg);   /* never wider than the ring */
    overflow-wrap: anywhere; transition: color .8s;
  }
  .caption { text-transform: uppercase; letter-spacing: .02em; }
  .caption:empty { display: none; }
  .caption.long { font-size: calc(var(--ring) * .085); }   /* long titles step down to stay 2 lines-ish */
  .digits {
    display: flex; align-items: baseline; font-weight: 700; line-height: .95; letter-spacing: -.02em;
    font-size: 26cqi; color: var(--fg); transition: color .8s;
    user-select: none;
  }
  .ring.long .digits { font-size: 21.5cqi; }
  .digits .d { display: inline-block; width: .64em; text-align: center; }
  .digits .c { display: inline-block; width: .32em; text-align: center; color: var(--accent); }

  /* controls sit at the bottom like footer items: one row, small and faint */
  .controls {
    display: flex; flex-wrap: nowrap; gap: .4rem; align-items: center; justify-content: center;
    width: 0;                 /* row overflows evenly around the ring instead of widening the column */
    opacity: .28; transition: opacity .3s;
  }
  .controls:hover, .controls:focus-within { opacity: .9; }
  button, .set input {
    font: 500 .7rem var(--latin); border-radius: 999px; cursor: pointer; transition: all .2s;
  }
  button {
    color: var(--fg); background: transparent; border: 1px solid currentColor; padding: .28rem .75rem; white-space: nowrap;
  }
  .set { display: flex; align-items: center; gap: .35rem; font-size: .7rem; white-space: nowrap; color: var(--fg); }
  .set input {
    width: 3rem; padding: .25rem .3rem; text-align: center; cursor: text;
  }
  #mins { border-color: transparent; }   /* no outline on the minutes field */
  .set input.wide { width: 9rem; text-align: left; padding-left: .6rem; border-radius: 4px;
    color: var(--fg); background: transparent; border: 1px solid currentColor;
  }
  body.hide-ui .controls { visibility: hidden; }

  /* credit: its own full-width row under the content, centred */
  .panel.left { grid-column: 1; grid-row: 1 / -1; }
  .panel.right { grid-column: 3; grid-row: 1 / -1; }
  .stage { grid-column: 2; grid-row: 1; }
  .credit {
    grid-column: 2; grid-row: 2; position: relative; z-index: 2; text-align: center;
    padding: 0 1rem clamp(.6rem, 1.6vh, 1rem);
    font: 400 clamp(.8rem, 1.05vw, 1.1rem) var(--latin); letter-spacing: .04em;
    color: var(--fg); opacity: .55; transition: color .8s;
  }
  .credit b { font-weight: 500; }

  /* ---------- pattern panels (one each side) ---------- */
  .panel {
    position: relative; z-index: 1; overflow: hidden; color: var(--pat);
    display: flex; transition: color .8s;
  }
  .panel.left  { -webkit-mask-image: linear-gradient(90deg,  #000 45%, transparent); mask-image: linear-gradient(90deg,  #000 45%, transparent); }
  .panel.right { -webkit-mask-image: linear-gradient(270deg, #000 45%, transparent); mask-image: linear-gradient(270deg, #000 45%, transparent); }
  .strip { position: relative; flex: 1 1 0; min-width: 0; overflow: hidden; opacity: .6; transition: opacity .8s; }
  body.done .strip { opacity: .7; }
  .strip svg { display: block; will-change: transform; animation-timing-function: linear; animation-iteration-count: infinite; }
  @keyframes up   { from { transform: translateY(0); } to { transform: translateY(calc(var(--th) * -1)); } }
  @keyframes down { from { transform: translateY(calc(var(--th) * -1)); } to { transform: translateY(0); } }

  /* ---------- glowing lights (top + bottom) while the countdown runs ---------- */
  @property --x { syntax: "<percentage>"; inherits: false; initial-value: 50%; }
  .lights {
    position: fixed; left: 0; right: 0; height: 46vh; z-index: 1; pointer-events: none;
    --c: 36,182,99; --hot: #8dffbe;
    opacity: 0; transition: opacity 1.4s ease;
    animation: sweep 9s ease-in-out infinite alternate, breathe 3.2s ease-in-out infinite;
    animation-play-state: paused;
  }
  .lights.top    { top: 0;    background: radial-gradient(ellipse 60% 100% at var(--x) 0%,   rgba(var(--c),.85), rgba(var(--c),.28) 40%, transparent 78%); }
  .lights.bottom { bottom: 0; background: radial-gradient(ellipse 60% 100% at var(--x) 100%, rgba(var(--c),.85), rgba(var(--c),.28) 40%, transparent 78%);
                   animation-direction: alternate-reverse, normal; animation-delay: 0s, -1.6s; }
  .lights::before {           /* thin bright light line along the edge */
    content: ""; position: absolute; left: 0; right: 0; height: 4px;
    background: radial-gradient(ellipse 35% 100% at var(--x) 50%, var(--hot), rgba(var(--c),.8) 40%, transparent 100%);
    box-shadow: 0 0 28px 8px rgba(var(--c),.8);
  }
  .lights.top::before    { top: 0; }
  .lights.bottom::before { bottom: 0; }
  body.running .lights { opacity: 1; animation-play-state: running; }
  @keyframes sweep   { from { --x: 18%; } to { --x: 82%; } }
  @keyframes breathe { 0%, 100% { filter: brightness(.85); } 50% { filter: brightness(1.25); } }

  @media (prefers-reduced-motion: reduce) {
    .strip svg, .lights { animation-play-state: paused !important; }
    body.leaving::before { animation: none; transition: opacity .8s; }
    body.leaving h1, body.leaving .digits, body.leaving .caption, body.leaving .eyebrow, body.leaving .logo { animation: none; }
  }
  @media (max-aspect-ratio: 4/5) {
    :root { --panel: clamp(36px, 10vw, 90px); --ring: min(68vw, 42vh); }
    .stage { flex-direction: column; overflow-y: auto; }
    .main { flex: 0 0 auto; padding-left: 1rem; padding-right: 1rem; }
    .counter { padding-top: 0; }
    h1 { font-size: clamp(2rem, 9vw, 3.8rem); }
  }
</style>
</head>

<script>
(function () {
  /* ---------- pattern loop ---------- */
  var P = 112.846, W = 86.66, GAP = 14, VW = W + GAP, Y0 = 250;  // one vertical period of the pattern
  var panelL = document.getElementById('panelL'), panelR = document.getElementById('panelR'), SPEED = 34; // px per second
  var NS = 'http://www.w3.org/2000/svg';

  function buildPanel(panel, dir, phase, alignRight) {
    var pw = panel.clientWidth, ph = panel.clientHeight || window.innerHeight;
    if (!pw) return;
    var s = pw / VW, th = P * s, rows = Math.ceil(ph / th) + 2;
    panel.textContent = '';
    var strip = document.createElement('div'); strip.className = 'strip';
    var svg = document.createElementNS(NS, 'svg');
    var vh = (rows + 1) * P;
    // the unit's spacing (GAP) sits on the inner side, so each pattern touches its screen edge
    svg.setAttribute('viewBox', (alignRight ? -GAP : 0) + ' ' + (Y0 - P) + ' ' + VW + ' ' + vh);
    svg.setAttribute('width', pw); svg.setAttribute('height', vh * s);
    svg.setAttribute('fill', 'currentColor');
    for (var k = -2; k <= rows + 1; k++) {
      var u = document.createElementNS(NS, 'use');
      u.setAttribute('href', '#u'); u.setAttribute('transform', 'translate(0,' + (k * P).toFixed(3) + ')');
      svg.appendChild(u);
    }
    svg.style.setProperty('--th', th + 'px');
    svg.style.animationName = dir;
    svg.style.animationDuration = (th / SPEED) + 's';
    svg.style.animationDelay = (-phase * (th / SPEED)) + 's';
    strip.appendChild(svg); panel.appendChild(strip);
  }
  function buildStrips() { buildPanel(panelL, 'up', 0); buildPanel(panelR, 'down', 0.5, true); }
  var rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(buildStrips, 150); });
  buildStrips();

  /* ---------- countdown ---------- */
  var timeEl = document.getElementById('time'), prog = document.getElementById('prog'),
      ring = document.getElementById('ring'), C = 2 * Math.PI * 47,
      startBtn = document.getElementById('start'), minsIn = document.getElementById('mins');
  var total = 600, remaining = 600, endAt = 0, raf = 0, running = false, audio;

  function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
  var last = '';
  function paint(str) {            // fixed-width cells so digits never jitter
    if (str === last) return; last = str;
    timeEl.innerHTML = str.split('').map(function (ch) {
      return '<span class="' + (ch === ':' ? 'c' : 'd') + '">' + ch + '</span>';
    }).join('');
  }
  function render() {
    var s = Math.ceil(remaining), str = fmt(s);
    paint(str);
    document.title = (running || remaining < total ? str + ' · ' : '') + 'Yehulu SACCOS';
    var f = total ? remaining / total : 0;
    prog.style.strokeDasharray = (f * C).toFixed(2) + ' ' + C.toFixed(2);
    prog.style.opacity = f > 0.0005 ? 1 : 0;
    ring.classList.toggle('long', s >= 6000);
  }
  function beep() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      for (var i = 0; i < 3; i++) {
        var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * 0.4;
        o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        o.start(t); o.stop(t + 0.3);
      }
    } catch (e) {}
  }
  function tick() {
    remaining = Math.max(0, (endAt - performance.now()) / 1000); render();
    if (remaining <= 0) { finish(); return; }
    raf = requestAnimationFrame(tick);
  }
  function finish() {
    running = false; document.body.classList.remove('running'); startBtn.textContent = 'Start';
    document.body.classList.add('done'); beep();
  }
  var leaveT;
  function leaveDone() {           // graceful exit from the end screen back to the countdown
    var b = document.body;
    if (!b.classList.contains('done')) return;
    var r = ring.getBoundingClientRect();
    b.style.setProperty('--cx', (r.left + r.width / 2) + 'px');
    b.style.setProperty('--cy', (r.top + r.height / 2) + 'px');
    b.classList.remove('leaving'); void b.offsetWidth;   // restart the animation if triggered twice
    b.classList.add('leaving'); b.classList.remove('done');
    clearTimeout(leaveT); leaveT = setTimeout(function () { b.classList.remove('leaving'); }, 1600);
  }
  function start() {
    if (remaining <= 0) reset();
    leaveDone();
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
    endAt = performance.now() + remaining * 1000; running = true; document.body.classList.add('running'); startBtn.textContent = 'Pause';
    raf = requestAnimationFrame(tick);
  }
  function pause() { running = false; document.body.classList.remove('running'); cancelAnimationFrame(raf); startBtn.textContent = 'Resume'; }
  function reset() {
    running = false; document.body.classList.remove('running'); cancelAnimationFrame(raf);
    var m = Math.max(1, Math.min(999, parseInt(minsIn.value, 10) || 10));
    total = remaining = m * 60;
    leaveDone();
    startBtn.textContent = 'Start'; render();
  }
  startBtn.onclick = function () { running ? pause() : start(); };
  document.getElementById('reset').onclick = reset;
  minsIn.onchange = reset;

  /* end-screen logo: reuse the embedded logo image as the mask for the solid green version */
  var logoEl = document.querySelector('.logo');
  logoEl.style.setProperty('--logo', 'url("' + logoEl.querySelector('.on-dark').src + '")');

  /* optional caption: typed in the controls row, remembered between visits, ?title=... also works */
  var capEl = document.getElementById('caption'), capIn = document.getElementById('capIn');
  function setCaption(t) {
    capEl.textContent = t.trim(); capIn.value = t;
    capEl.classList.toggle('long', t.trim().length > 22);
    try { localStorage.setItem('yehulu-caption', t); } catch (e) {}
  }
  capIn.oninput = function () { setCaption(capIn.value); };
  var q = null; try { q = new URLSearchParams(location.search).get('title'); } catch (e) {}
  var saved = ''; try { saved = localStorage.getItem('yehulu-caption') || ''; } catch (e) {}
  setCaption(q !== null ? q : saved);
  document.getElementById('full').onclick = function () {
    try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(function () {}); } catch (e) {}
  };
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); startBtn.click(); }
    else if (e.key === 'r') reset();
    else if (e.key === 'h') document.body.classList.toggle('hide-ui');   // hide controls for projection
  });
  render();
})();
