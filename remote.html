<style>
  :root { --growth: #24b663; --ever: #034d3d; --white: #fff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Rubik", Arial, sans-serif; background: var(--ever); color: var(--white);
    min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; gap: 1.5rem;
    padding: 1.5rem 1.25rem 2rem; max-width: 520px; margin: 0 auto;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  header img { height: 52px; width: auto; }
  .status { font-size: .8rem; display: flex; align-items: center; gap: .4rem; opacity: .9; }
  .status i { width: .6rem; height: .6rem; border-radius: 50%; background: #ffffff55; }
  .status.ok i { background: var(--growth); }
  .label { font-weight: 500; letter-spacing: .14em; text-transform: uppercase; font-size: .8rem; color: var(--growth); }
  .time { font-weight: 700; font-size: clamp(4.5rem, 27vw, 9rem); line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: .25rem; }
  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.16); overflow: hidden; margin-top: 1rem; }
  .bar > i { display: block; height: 100%; background: var(--growth); transform-origin: left; }
  button, input { font: 500 1rem "Rubik", Arial, sans-serif; border-radius: 999px; }
  button { color: var(--white); background: transparent; border: 1.5px solid rgba(255,255,255,.7); padding: .9rem 1.2rem; cursor: pointer; }
  button:active { transform: scale(.98); }
  #start { width: 100%; padding: 1.4rem; font-size: 1.4rem; font-weight: 700; background: var(--growth); border-color: var(--growth); color: var(--ever); }
  .row { display: flex; gap: .6rem; flex-wrap: wrap; }
  .row > * { flex: 1 1 0; min-width: 0; }
  .row button.on { background: var(--white); color: var(--ever); border-color: var(--white); }
  h2 { font-size: .8rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--growth); margin: .5rem 0 .6rem; }
  input { width: 100%; padding: .9rem 1rem; text-align: center; color: var(--white); background: transparent; border: 1.5px solid rgba(255,255,255,.7); }
  input::placeholder { color: rgba(255,255,255,.55); }
  .room { margin-top: auto; font-size: .8rem; opacity: .7; }
  [hidden] { display: none !important; }
</style>

    <div class="status" id="status"><i></i><span id="statusText">Connecting</span></div>
  </header>

  <section id="join" hidden>
    <h2>Enter the room code</h2>
    <div class="row"><input id="code" placeholder="Room code" autocapitalize="none" autocomplete="off"><button id="go">Connect</button></div>
  </section>

  <section id="ctl">
    <div class="label" id="label">Starts in</div>
    <div class="time" id="time" role="timer">10:00</div>
    <div class="bar"><i id="fill"></i></div>
  </section>

  <section id="btns">
    <button id="start">Start</button>
    <div class="row" style="margin-top:.6rem"><button id="reset">Reset</button></div>
    <h2 style="margin-top:1.5rem">Length (minutes)</h2>
    <div class="row" id="presets">
      <button data-m="5">5</button><button data-m="10">10</button><button data-m="15">15</button><button data-m="20">20</button>
    </div>
    <div class="row" style="margin-top:.6rem">
      <input type="number" id="mins" min="1" max="999" inputmode="numeric" placeholder="Custom">
      <button id="set">Set</button>
    </div>
    <h2 style="margin-top:1.5rem">Title above the timer</h2>
    <input type="text" id="cap" maxlength="80" placeholder="Speaker or session name" autocomplete="off" style="text-align:left;border-radius:14px">
    <div class="row" style="margin-top:.6rem"><button id="capSet">Show</button><button id="capClear">Clear</button></div>
    <div class="room" id="capNow" style="margin-top:.6rem"></div>
  </section>

  <div class="room" id="roomText"></div>

<script>
(function () {
  /* ---------- shared timer state (synced through /api/state) ---------- */
  var qs = new URLSearchParams(location.search);
  var room = (qs.get('room') || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  var online = location.protocol !== 'file:';
  var S = { total: 600, remaining: 600, running: false, endAt: 0, rev: 0 }, offset = 0, busy = 0, linked = false;

  function now() { return Date.now() + offset; }            // server clock
  function left() { return S.running ? Math.max(0, (S.endAt - now()) / 1000) : S.remaining; }
  function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }

  // Keep in sync with reduce() in api/state.js
  function reduce(s, action, t, minutes, title) {
    var n = { total: s.total, remaining: s.remaining, running: s.running, endAt: s.endAt, caption: s.caption, rev: (s.rev || 0) + 1 };
    var expired = s.running && t >= s.endAt;
    if (action === 'start') {
      if (s.running && !expired) return s;
      var rem = expired || s.remaining <= 0 ? s.total : s.remaining;
      n.remaining = rem; n.running = true; n.endAt = t + rem * 1000;
    } else if (action === 'pause') {
      if (!s.running || expired) return s;
      n.remaining = Math.max(0, (s.endAt - t) / 1000); n.running = false; n.endAt = 0;
    } else if (action === 'reset' || action === 'set') {
      if (action === 'set') n.total = Math.max(1, Math.min(999, parseInt(minutes, 10) || 10)) * 60;
      n.remaining = n.total; n.running = false; n.endAt = 0;
    } else if (action === 'title') {
      n.caption = String(title == null ? '' : title).slice(0, 80);
    } else return s;
    return n;
  }
  function api() { return '/api/state?room=' + encodeURIComponent(room); }
  function take(d) { if (d && d.state) { offset = d.now - Date.now(); S = d.state; linked = true; } else linked = false; }
  function send(action, value) {                             // value: minutes for 'set', text for 'title'
    S = reduce(S, action, now(), value, value);                   // apply instantly, then confirm with the server
    if (!online || !room) return;
    busy++;
    fetch(api(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: action, minutes: value, title: value }) })
      .then(function (r) { return r.json(); }).then(take)
      .catch(function () { linked = false; })
      .then(function () { busy--; });
  }
  function poll() {
    if (!online || !room || busy || document.hidden) return;
    fetch(api(), { cache: 'no-store' }).then(function (r) { return r.json(); })
      .then(function (d) { if (!busy) take(d); })
      .catch(function () { linked = false; });
  }

  var $ = function (id) { return document.getElementById(id); };
  if (!room) {
    $('join').hidden = false; $('ctl').hidden = true; $('btns').hidden = true; $('status').hidden = true;
    $('go').onclick = function () {
      var c = $('code').value.toLowerCase().replace(/[^a-z0-9]/g, '');
      if (c.length >= 4) location.search = '?room=' + c;
    };
    return;
  }
  $('roomText').textContent = 'Room: ' + room;

  function ui() {
    var r = left(), done = S.running && r <= 0, s = Math.ceil(r);
    $('time').textContent = fmt(s);
    $('fill').style.transform = 'scaleX(' + (S.total ? r / S.total : 0) + ')';
    $('label').textContent = done ? 'Starting now' : (S.running ? 'Running' : (S.remaining < S.total ? 'Paused' : 'Starts in'));
    $('start').textContent = S.running && !done ? 'Pause' : (done ? 'Restart' : (S.remaining < S.total ? 'Resume' : 'Start'));
    $('status').className = 'status' + (linked ? ' ok' : '');
    $('statusText').textContent = linked ? 'Connected' : 'Offline';
    var m = S.total / 60, bs = $('presets').children;
    for (var i = 0; i < bs.length; i++) bs[i].className = (+bs[i].getAttribute('data-m') === m ? 'on' : '');
    $('capNow').textContent = S.caption ? 'On screen: ' + S.caption : 'No title on screen';
    requestAnimationFrame(ui);
  }
  $('start').onclick = function () { send(S.running && left() > 0 ? 'pause' : 'start'); };
  $('reset').onclick = function () { send('reset'); };
  $('presets').onclick = function (e) { var m = e.target.getAttribute('data-m'); if (m) send('set', +m); };
  $('set').onclick = function () { var m = parseInt($('mins').value, 10); if (m > 0) { send('set', m); $('mins').value = ''; $('mins').blur(); } };

  $('capSet').onclick = function () { send('title', $('cap').value.trim()); $('cap').blur(); };
  $('cap').onkeydown = function (e) { if (e.key === 'Enter') $('capSet').click(); };
  $('capClear').onclick = function () { $('cap').value = ''; send('title', ''); };

  setInterval(poll, 1000); poll(); ui();
})();
</script>
</body>
</html>
